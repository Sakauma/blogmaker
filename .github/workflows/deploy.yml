name: Build and deploy (manual)

# Source pushes do not publish. Run this workflow explicitly to deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-sakauma-site
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure deploy key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          test -n "$DEPLOY_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Publish verified build
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --branch main git@github.com:Sakauma/Sakauma.github.io.git "$RUNNER_TEMP/sakauma-deploy"
          node scripts/deploy-local.mjs "$RUNNER_TEMP/sakauma-deploy"
